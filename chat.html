<!doctype html>
<html lang="es">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Mini Chat - Starlette</title>
	<link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
	<section class="card">
		<div class="header">
			<h1>Mini Chat</h1>
		</div>

		<div id="log" aria-live="polite"></div>

		<form id="chat-form" class="controls">
			<input id="message-input" placeholder="Escribe un mensaje y pulsa Enter" autocomplete="off" />
			<button type="submit">Enviar</button>
		</form>

		<div class="status" id="status">Estado: conectando...</div>
	</section>

	<script src="/static/chat.js"></script>
</body>
</html>
