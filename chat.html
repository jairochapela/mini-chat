<!doctype html>
<html lang="es">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Mini Chat - Starlette</title>
	<style>
		:root {
			--bg: #f4f7fb;
			--surface: #ffffff;
			--ink: #1f2a37;
			--muted: #5b6470;
			--accent: #1e6fd9;
			--accent-soft: color-mix(in srgb, var(--accent) 14%, white);
			--border: #d8e1ec;
			--base-soft: color-mix(in srgb, var(--muted) 10%, white);
			--base-soft-border: color-mix(in srgb, var(--muted) 28%, white);
			--base-soft-ink: color-mix(in srgb, var(--muted) 72%, black);
			--muted-soft: color-mix(in srgb, var(--muted) 16%, white);
			--muted-soft-border: color-mix(in srgb, var(--muted) 34%, white);
			--shell-gap: 16px;
			--header-h: 72px;
			--form-h: 76px;
		}
		* { box-sizing: border-box; }
		body {
			margin: 0;
			font-family: "Avenir Next", "Segoe UI", sans-serif;
			color: var(--ink);
			background:
				radial-gradient(circle at 15% 10%, #ffffff 0%, transparent 35%),
				radial-gradient(circle at 85% 90%, #eaf2ff 0%, transparent 30%),
				var(--bg);
			min-height: 100vh;
			display: grid;
			place-items: center;
			/* padding: 16px; */
		}
		.card {
			width: min(760px, 100%);
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: 16px;
			box-shadow: 0 12px 32px rgba(31, 42, 55, 0.08);
			margin: 0;
			overflow: hidden;
			position: relative;
		}
		.header {
			position: fixed;
			top: var(--shell-gap);
			left: 50%;
			transform: translateX(-50%);
			width: min(760px, calc(100% - 32px));
			z-index: 20;
			padding: 16px 18px;
			background: linear-gradient(120deg, #f7fbff, #eef5ff);
			border-bottom: 1px solid var(--border);
		}
		.header h1 {
			margin: 0;
			font-size: 1.1rem;
			letter-spacing: 0.2px;
		}
		.header p {
			margin: 6px 0 0;
			color: var(--muted);
			font-size: 0.92rem;
		}
		#log {
			position: fixed;
			top: calc(var(--shell-gap) + var(--header-h));
			bottom: calc(var(--shell-gap) + var(--form-h));
			left: 50%;
			transform: translateX(-50%);
			width: min(760px, calc(100% - 32px));
			overflow-y: auto;
			padding: 12px;
			display: block;
			background: #fcfdff;
			z-index: 10;
			scroll-padding-bottom: 92px;
		}
		.line {
			font-family:Arial, Helvetica, sans-serif;
			font-size: 0.9rem;
			padding: 10px 12px;
			min-height: 1rem;
			word-break: break-word;
			width: fit-content;
			max-width: min(78%, 560px);
			margin-bottom: 8px;
			line-height: 1.35;
		}
		.line.user {
			background: var(--base-soft);
			border: 1px solid var(--base-soft-border);
			border-radius: 16px 16px 16px 5px;
			color: var(--base-soft-ink);
		}
		.line.me {
			background: var(--accent-soft);
			border: 1px solid color-mix(in srgb, var(--accent) 40%, white);
			border-radius: 16px 16px 5px 16px;
			color: color-mix(in srgb, var(--accent) 64%, black);
			margin-left: auto;
		}
		.line.system {
			/*background: var(--muted-soft);
			border: 1px solid var(--muted-soft-border);
			border-radius: 10px;*/
			color: var(--muted);
			width: 100%;
			max-width: 100%;
			text-align: center;
		}
		.line .username {
			display: inline-block;
			font-size: 0.78rem;
			font-weight: 700;
			letter-spacing: 0.02em;
			margin-right: 8px;
			padding: 2px 7px;
			/* border-radius: 999px; */
			vertical-align: middle;
		}
		.line .username::after {
			content: ":";
			margin-left: 1px;
		}
		.line.user .username {
			/* background: #dceaff; */
			color: color-mix(in srgb, var(--muted) 80%, black);
			/* border: 1px solid #bfd7ff; */
		}
		.line.me .username {
			/* background: #cbe1ff; */
			color: color-mix(in srgb, var(--accent) 75%, black);
			/* border: 1px solid #accbff; */
		}
		#chat-form.controls {
			position: fixed;
			bottom: 16px;
			left: 50%;
			transform: translateX(-50%);
			width: min(760px, calc(100% - 32px));
			z-index: 20;
			display: grid;
			grid-template-columns: 1fr auto;
			gap: 10px;
			padding: 12px;
			padding-bottom: max(12px, calc(12px + env(safe-area-inset-bottom)));
			border-top: 1px solid var(--border);
			background: #ffffff;
			border-radius: 12px;
			box-shadow: 0 8px 20px rgba(31, 42, 55, 0.08);
		}
		input, button {
			height: 42px;
			border-radius: 10px;
			border: 1px solid var(--border);
			font-size: 0.95rem;
		}
		input {
			width: 100%;
			padding: 0 12px;
			outline: none;
		}
		input:focus {
			border-color: var(--accent);
			box-shadow: 0 0 0 3px var(--accent-soft);
		}
		button {
			min-width: 110px;
			border-color: transparent;
			background: var(--accent);
			color: #fff;
			cursor: pointer;
			font-weight: 600;
		}
		button:hover { filter: brightness(1.05); }
		.status {
			padding: 0 12px 12px;
			color: var(--muted);
			font-size: 0.85rem;
			background: #ffffff;
		}
	</style>
</head>
<body>
	<section class="card">
		<div class="header">
			<h1>Mini Chat</h1>
		</div>

		<div id="log" aria-live="polite"></div>

		<form id="chat-form" class="controls">
			<input id="message-input" placeholder="Escribe un mensaje y pulsa Enter" autocomplete="off" />
			<button type="submit">Enviar</button>
		</form>

		<div class="status" id="status">Estado: conectando...</div>
	</section>

	<script>
        // Identidad del usuario: comprobación de cookie
        

        const username = prompt("Nombre de usuario")
        const uuid_client = crypto.randomUUID()

		// Construimos la URL WebSocket segun el protocolo de la pagina actual.
		// Si la pagina va por https, el socket debe ir por wss.
		const scheme = window.location.protocol === "https:" ? "wss" : "ws";
        const querystring = `username=${encodeURIComponent(username)}&id=${uuid_client}`;
		const wsUrl = `${scheme}://${window.location.host}/ws?${querystring}`;

		const socket = new WebSocket(wsUrl);
		const log = document.getElementById("log");
		const form = document.getElementById("chat-form");
		const input = document.getElementById("message-input");
		const status = document.getElementById("status");

		function colorFromUsername(username) {
			let hash = 0;
			for (let i = 0; i < username.length; i++) {
				hash = username.charCodeAt(i) + ((hash << 5) - hash);
			}
			const hue = hash % 360;
			return `hsl(${hue}, 30%, 50%)`;
		}

		function addLine(msgtype, username, text) {
			const div = document.createElement("div");
			div.className = "line " + msgtype;

			if (msgtype === "system") {
				div.textContent = text;
			} else {
				const spanUserText = document.createElement("span");
				spanUserText.className = "username";
				spanUserText.style.color = colorFromUsername(username);
				spanUserText.textContent = username;

				const messageText = document.createElement("span");
				messageText.textContent = text;

				div.appendChild(spanUserText);
				div.appendChild(messageText);
			}

			log.appendChild(div);
			requestAnimationFrame(() => {
				div.scrollIntoView({ block: "end" });
				log.scrollTop = log.scrollHeight;
			});
		}

		socket.addEventListener("open", () => {
			status.textContent = "Estado: conectado";
			addLine('system', null, "Conexion WebSocket abierta");
		});

		socket.addEventListener("message", (event) => {
            data = JSON.parse(event.data);
            console.log(data, username, data.username, username==data.username);
            if (data.type == 'system') {
                addLine('system', null, data.message);
            } else if (data.username == username) {
                addLine('me', username, data.message);
            } else {
			    addLine('user', data.username, data.message);
            }
		});

		socket.addEventListener("close", () => {
			status.textContent = "Estado: desconectado";
			addLine('system', null, "Conexion WebSocket cerrada");
		});

		socket.addEventListener("error", () => {
			status.textContent = "Estado: error de conexion";
			addLine('system', null, "Error en WebSocket");
		});

		form.addEventListener("submit", (event) => {
			event.preventDefault();

			const message = input.value.trim();
			if (!message) return;

			// Enviamos texto plano; en una app real podrias usar JSON.
			socket.send(message);
			input.value = "";
			input.focus();
		});
	</script>
</body>
</html>
